# Optional public TLS edge; retain default local development without this file.
# On the VM, bind Web to loopback :5180 and include this file in COMPOSE_FILE.
services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the public DNS hostname for HTTPS}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  caddy_data:
  caddy_config:
