name: dml-campus-emotions
x-api: &api
  image: campus-notes-api:local
  build: ./backend
  environment: &env
    DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD:?Run scripts/setup.sh first}@db:5432/campus
    ASSET_DIR: /assets
    REPORT_DIR: /reports
    APP_ORIGINS: ${APP_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ORT_INTRA_THREADS: ${ORT_INTRA_THREADS:-2}
    ORT_INTER_THREADS: ${ORT_INTER_THREADS:-1}
    ENABLE_SENTIMENT: "true"
    SENTIMENT_URL: http://sentiment:8000
    OMP_NUM_THREADS: ${ORT_INTRA_THREADS:-2}
    OPENBLAS_NUM_THREADS: "1"
    TOKENIZERS_PARALLELISM: "false"
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: campus
      POSTGRES_DB: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh first}
    volumes: [database:/var/lib/postgresql/data]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U campus -d campus"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *api
    command: [python, -m, app.cli, init]
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *api
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: [reports:/reports:ro]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *api
    command: [python, -m, app.worker]
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: [assets:/assets, reports:/reports]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 3g
    cpus: ${EMOTION_CPUS:-2}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from app.db import connect; c=connect(); assert c.execute("SELECT 1 FROM runtimes WHERE heartbeat>now()-interval '30 seconds' LIMIT 1").fetchone()
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 6
  sentiment:
    image: campus-cardiff-cpu:integrated
    build: ./experiments/cardiff-cpu
    environment:
      TORCH_THREADS: ${TORCH_THREADS:-2}
      TORCH_INTER_THREADS: "1"
      OMP_NUM_THREADS: ${TORCH_THREADS:-2}
      HOST_LABEL: ${HOST_LABEL:-local-integrated-campus}
    volumes: [sentiment_assets:/assets, sentiment_reports:/reports]
    restart: unless-stopped
    cpus: ${SENTIMENT_CPUS:-2}
    mem_limit: 4g
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      start_period: 300s
      interval: 10s
      timeout: 5s
      retries: 10
  sentiment-worker:
    <<: *api
    command: [python, -m, app.sentiment_worker]
    depends_on:
      migrate: { condition: service_completed_successfully }
      sentiment: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          'from app.db import connect; c=connect(); assert c.execute("SELECT 1 FROM sentiment_runtimes WHERE heartbeat>now()-interval ''30 seconds'' LIMIT 1").fetchone()',
        ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    image: campus-notes-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-5180}:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  cli:
    <<: *api
    profiles: [tools]
    command: [python, -m, app.cli, init]
    depends_on:
      db: { condition: service_healthy }
    volumes: [assets:/assets, reports:/reports]
  tests:
    <<: *api
    profiles: [tools]
    command: [python, -m, pytest, -q, -o, cache_dir=/tmp/pytest-cache, tests]
    environment:
      <<: *env
      ENABLE_SENTIMENT: "false"
      TEST_DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD}@db:5432/campus_test
    depends_on:
      db: { condition: service_healthy }
volumes:
  database:
  assets:
  reports:
  sentiment_assets:
  sentiment_reports:
