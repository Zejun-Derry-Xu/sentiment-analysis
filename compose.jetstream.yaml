# Apply with COMPOSE_FILE=compose.yaml:compose.jetstream.yaml on Linux.
# Fixed short-comment sweep selected 6 ORT threads and 4 Torch threads.
services:
  db:
    cpus: 2
    mem_limit: 2g
  api:
    cpus: 2
    mem_limit: 1g
  worker:
    cpus: 6
    environment:
      ORT_INTRA_THREADS: "6"
      OMP_NUM_THREADS: "6"
  sentiment:
    cpus: 6
    mem_limit: 4g
    environment:
      TORCH_THREADS: "4"
      OMP_NUM_THREADS: "4"
