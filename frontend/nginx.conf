server {
 listen 80;
 server_tokens off;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $api_upstream http://api:8000;
 root /usr/share/nginx/html;
 client_max_body_size 16k;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header X-Content-Type-Options nosniff always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass $api_upstream$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
 location = /health { proxy_pass $api_upstream$request_uri; }
 location = /ready { proxy_pass $api_upstream$request_uri; }
 location / { try_files $uri $uri/ /index.html; }
}
